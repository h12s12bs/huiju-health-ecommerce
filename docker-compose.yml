version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lerou_custom_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lerou_custom_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
